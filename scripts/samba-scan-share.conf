# Append this block to /etc/samba/smb.conf, then:
#   sudo smbpasswd -a scanner        (set a password the Printer will use)
#   sudo systemctl restart smbd
#
# Keep this share dumb and narrow: write-only-feeling, single purpose,
# nothing the recipient or the printer can browse into.

[scans]
    path = /srv/scans/inbox
    browseable = no
    writable = yes
    guest ok = no
    valid users = scanner
    create mask = 0664
    directory mask = 0775
    force user = scanpipeline
